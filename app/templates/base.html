<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudDrop — хмарний обмін файлами</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --acc:#38bdf8; --err:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
           justify-content:center; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:20px; }
    .card { background:var(--card); border-radius:16px; padding:36px; width:100%; max-width:480px;
            box-shadow:0 20px 50px rgba(0,0,0,.35); text-align:center; }
    h1 { margin:0 0 6px; font-size:30px; } h1 span { color:var(--acc); }
    p.sub { color:var(--muted); margin:0 0 26px; }
    .drop { border:2px dashed #334155; border-radius:12px; padding:30px 16px; cursor:pointer; display:block;
            transition:.2s; } .drop:hover { border-color:var(--acc); }
    .drop input { display:none; } #fname { color:var(--acc); margin-top:8px; word-break:break-all; }
    button, .btn { margin-top:20px; width:100%; padding:14px; border:0; border-radius:10px; background:var(--acc);
             color:#0f172a; font-weight:700; font-size:16px; cursor:pointer; text-decoration:none; display:block; }
    .link { background:#0f172a; padding:14px; border-radius:10px; word-break:break-all; margin:18px 0 0;
            font-family: ui-monospace, monospace; color:var(--acc); }
    .err { color:var(--err); margin-bottom:14px; }
    footer { color:var(--muted); font-size:12px; margin-top:20px; text-align:center; }
    code { color:var(--acc); }
  </style>
</head>
<body>
  <div class="card">
    <h1>☁️ Cloud<span>Drop</span></h1>
    <p class="sub">Хмарний сервіс обміну файлами</p>
    {% block content %}{% endblock %}
  </div>
  <footer>Сховище: <code>{{ mode }}</code> · Сервер: <code>{{ host }}</code> · Microsoft Azure + Linux + Docker</footer>
</body>
</html>
